<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap 2026-2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0C2340;
    --red:#BD3039;
    --ink:#1A1A1A;
    --bg:#F5F6F8;
    --card:#FFFFFF;
    --line:#D9DEE4;
    --muted:#5F6B78;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
    zoom:.75;
  }
  h1,h2,.phase-sign .pname,.mini-lbl,.here-flag,.mini-here-flag,.roadcap{font-family:'Barlow Condensed','Arial Narrow',sans-serif;}

  header{
    background:var(--navy); color:#fff; padding:12px 24px 11px;
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px;
    position:sticky; top:0; z-index:50;
  }
  header h1{font-size:26px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;}
  header h1 span{opacity:.55; font-weight:500;}
  header .sub{font-size:12.5px; opacity:.75;}

  main{max-width:1780px; margin:0 auto; padding:14px 20px 50px;}
  .layout{display:grid; grid-template-columns:240px minmax(0,1fr); gap:16px; align-items:start; transition:grid-template-columns .2s;}
  .layout.side-collapsed{grid-template-columns:44px minmax(0,1fr);}
  @media (max-width:900px){ .layout,.layout.side-collapsed{grid-template-columns:1fr;} .side{position:static; max-height:none;} }

  /* ===== checklist sidebar ===== */
  .side{
    position:sticky; top:calc(var(--hdrH) + 12px); background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:10px 10px 6px; max-height:calc(100vh - var(--hdrH) - 30px); overflow-y:auto;
  }
  .side-head{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:2px;}
  .side h2{font-size:15px; text-transform:uppercase; letter-spacing:.8px; color:var(--navy);}
  .side-toggle{
    border:1px solid var(--line); background:#fff; color:var(--navy); border-radius:6px;
    width:22px; height:22px; cursor:pointer; font-size:13px; line-height:1; font-weight:700; flex-shrink:0;
  }
  .side-toggle:hover{background:var(--bg);}
  .side .prog{font-size:11px; color:var(--muted); font-weight:500; margin-bottom:5px;}
  .prog-bar{height:4px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:8px;}
  .prog-bar i{display:block; height:100%; background:var(--navy); width:0%; transition:width .25s;}
  .close-all{
    border:none; background:none; padding:0 3px; margin:-2px 0 6px; cursor:pointer;
    font-size:10.5px; font-weight:600; color:var(--muted); letter-spacing:.3px;
    text-transform:uppercase;
  }
  .close-all:hover{color:var(--navy); text-decoration:underline;}
  .side.collapsed{padding:9px 7px; overflow:hidden;}
  .side.collapsed .side-head h2, .side.collapsed .side-body{display:none;}
  .side .v-lbl{display:none;}
  .side.collapsed .v-lbl{
    display:block; writing-mode:vertical-rl; margin:8px auto 0;
    font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-size:13.5px; font-weight:600;
    letter-spacing:1px; text-transform:uppercase; color:var(--navy); cursor:pointer;
  }
  .ck-group{margin-bottom:3px;}
  .ck-ghead{
    display:flex; align-items:center; gap:6px; width:100%; border:none; background:none;
    padding:5px 3px; cursor:pointer; border-radius:6px; text-align:left;
    font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-size:14px; font-weight:600;
    letter-spacing:.6px; text-transform:uppercase; color:var(--navy);
  }
  .ck-ghead:hover{background:var(--bg);}
  .ck-ghead .chev{font-size:9px; transition:transform .15s; color:var(--muted); width:9px;}
  .ck-group.closed .chev{transform:rotate(-90deg);}
  .ck-ghead .gdot{width:9px; height:9px; border-radius:3px; flex-shrink:0;}
  .ck-ghead .gcount{margin-left:auto; font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; color:var(--muted); letter-spacing:0;}
  .ck-group.closed .ck-list{display:none;}
  .ck-list{padding-left:3px;}
  .ck-item{
    display:flex; align-items:flex-start; gap:6px; padding:4px 3px 4px 12px; border-radius:6px;
    cursor:pointer; font-size:12px; line-height:1.3;
  }
  .ck-item:hover{background:var(--bg);}
  .ck-item input{margin-top:2px; accent-color:var(--navy); cursor:pointer; flex-shrink:0;}
  .ck-txt{font-weight:500;}
  .ck-date{display:block; font-size:10px; font-weight:600; color:var(--muted); letter-spacing:.3px;}
  .ck-item.done .ck-txt{text-decoration:line-through; color:var(--muted);}
  .ck-item.done{opacity:.75;}
  .ck-item.dim{opacity:.3;}

  :root{ --hdrH:54px; }

  /* locked bars: phase bar + filters stay pinned below the header */
  .topbars{
    position:sticky; top:var(--hdrH); z-index:40;
    background:var(--bg); padding-top:4px; margin-top:-4px;
    box-shadow:0 6px 8px -6px rgba(12,35,64,.12);
  }

  /* ===== year phase bar ===== */
  .minimap-wrap{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 18px 10px; margin-bottom:12px;}
  .minimap-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; flex-wrap:wrap; gap:8px;}
  .minimap-head h2{font-size:16px; text-transform:uppercase; letter-spacing:.8px; color:var(--navy);}
  .minimap-head .hint{font-size:11.5px; color:var(--muted);}
  .minimap{position:relative; height:28px; border-radius:6px; overflow:hidden; display:flex;}
  .minimap .seg{height:100%; position:relative; cursor:pointer; transition:opacity .2s, filter .15s;}
  .minimap .seg:hover{filter:brightness(1.12);}
  .minimap .seg.faded{opacity:.25;}
  .minimap .seg .mini-lbl{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:12px; font-weight:600; letter-spacing:.7px; text-transform:uppercase; white-space:nowrap; overflow:hidden;
    pointer-events:none;
  }
  .months{position:relative; height:36px; margin-top:3px;}
  .months span{position:absolute; transform:translateX(-50%); font-size:10px; color:var(--muted); font-weight:500;}
  .mini-here{position:absolute; top:-5px; bottom:-5px; width:3px; background:var(--navy); border-radius:2px; pointer-events:none;}
  /* We Are Here flag on the year bar (mirrors the road flag) */
  .mini-here-flag{
    position:absolute; top:14px; transform:translateX(-50%);
    background:var(--navy); color:#fff; font-size:12px; font-weight:600;
    letter-spacing:.8px; text-transform:uppercase; padding:2px 9px 1px;
    border-radius:4px; white-space:nowrap; pointer-events:none; z-index:3;
  }
  .mini-here-flag::before{content:""; position:absolute; left:50%; transform:translateX(-50%); bottom:100%; width:3px; height:17px; background:var(--navy);}
  .mini-here-flag.edge-l{transform:translateX(-6px);}
  .mini-here-flag.edge-r{transform:translateX(calc(-100% + 6px));}
  .mini-here-flag.edge-l::before,.mini-here-flag.edge-r::before{left:auto; right:auto; display:none;}

  /* ===== filters ===== */
  .filters{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px; align-items:center;}
  .filters .lbl{font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
  .chip{border:1px solid var(--line); background:#fff; border-radius:20px; padding:3px 12px; font-size:12.5px; font-weight:500; cursor:pointer;}
  .chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .filters .divider{width:1px; height:18px; background:var(--line); margin:0 6px;}

  /* ===== quick look panel ===== */
  .ql-panel{
    background:var(--card); border:1px solid var(--navy); border-radius:10px;
    padding:12px 14px; margin-bottom:12px;
  }
  .ql-head{display:flex; align-items:baseline; gap:10px; margin-bottom:9px; position:relative;}
  .ql-head h2{
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;
    font-size:17px; text-transform:uppercase; letter-spacing:.8px; color:var(--navy);
  }
  .ql-range{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.3px;}
  .ql-count{font-size:12px; font-weight:600; color:var(--muted);}
  .ql-head .x{
    position:absolute; top:-2px; right:0; border:none; background:none;
    font-size:18px; color:var(--muted); cursor:pointer; line-height:1;
  }
  .ql-cards{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start;}
  .ql-empty{font-size:13px; color:var(--muted); padding:2px 4px;}

  /* highlighted window band on the roads */
  .ql-band{
    position:absolute; top:calc(var(--ry) - 17px); height:34px; border-radius:8px;
    border:2px solid var(--navy); background:rgba(12,35,64,.07); z-index:1; pointer-events:none;
  }

  /* ===== stacked roads ===== */
  .stack-wrap{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 0 10px; margin-bottom:14px; scroll-margin-top:calc(var(--hdrH) + 152px);}

  .prow{
    display:grid; grid-template-columns:168px minmax(0,1fr); grid-template-rows:142px auto;
    transition:opacity .25s;
  }
  .prow.faded{opacity:.16;}
  .prow.faded .wp, .prow.faded .mlbl, .prow.faded .rangebar, .prow.faded .mstem{pointer-events:none;}
  .prow.faded .road, .prow.faded .phase-sign{cursor:pointer;}

  .phase-sign{
    grid-column:1; grid-row:1; align-self:end; justify-self:start; margin-left:14px; margin-bottom:16px;
    border:none; text-align:left; cursor:pointer; background:none; padding:6px 10px; border-radius:8px;
  }
  .phase-sign:hover{background:var(--bg);}
  .phase-sign .pname{
    display:inline-block; color:#fff; font-size:13.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    padding:4px 11px 3px; border-radius:5px; white-space:nowrap;
  }
  .phase-sign .pdates{display:block; font-size:10.5px; font-weight:600; color:var(--muted); margin-top:4px; letter-spacing:.3px;}

  .road-zone{grid-column:2; grid-row:1; position:relative; --ry:104px;}
  .road{
    position:absolute; top:var(--ry); transform:translateY(-50%); left:0;
    height:22px; border-radius:11px; box-shadow:0 1px 3px rgba(12,35,64,.25); cursor:pointer;
  }
  .road .lane{
    position:absolute; left:10px; right:10px; top:50%; height:0;
    border-top:2.5px dashed rgba(255,255,255,.85); pointer-events:none;
  }
  .wk{
    position:absolute; top:50%; width:7px; height:7px; border-radius:50%;
    background:#fff; opacity:.95; transform:translate(-50%,-50%); pointer-events:none; z-index:2;
  }
  .roadcap{
    position:absolute; font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:.5px;
    top:calc(var(--ry) + 24px); white-space:nowrap;
  }
  .roadcap.endcap{transform:translateX(-100%);}
  .mtick{position:absolute; top:calc(var(--ry) + 13px); width:1.5px; height:6px; background:#AEB8C2;}
  .mtick-lbl{position:absolute; top:calc(var(--ry) + 24px); transform:translateX(-50%); font-size:9.5px; color:#9AA5B1; font-weight:600; letter-spacing:.4px;}

  /* vertical labels rising from each marker, with a drop stem to the road */
  .mlbl{
    position:absolute; bottom:calc(100% - var(--ry) + 26px); transform:translateX(-50%);
    writing-mode:vertical-rl; text-orientation:mixed;
    font-size:10px; font-weight:600; color:#42536A; white-space:nowrap;
    max-height:76px; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer; z-index:6; line-height:1.15;
    transform:translateX(-50%) rotate(180deg);
  }
  .mlbl:hover{
    color:var(--red); max-height:none; background:var(--card);
    padding:3px 0; border-radius:3px; box-shadow:0 1px 5px rgba(12,35,64,.18); z-index:10;
  }
  .mlbl.dim{opacity:.15; pointer-events:none;}
  .mlbl.done{text-decoration:line-through; opacity:.55;}
  .mstem{
    position:absolute; width:1px; transform:translateX(-50%);
    top:calc(var(--ry) - 24px); height:11px;
    background:#C6CED7; z-index:3; pointer-events:none;
  }
  .mstem.dim{opacity:.15;}

  /* numbered waypoint markers (clustered when dates are too close) */
  .wp{
    position:absolute; top:50%; width:18px; height:18px; z-index:5;
    transform:translate(-50%,-50%) rotate(45deg);
    border-radius:4px; border:2px solid #fff; cursor:pointer;
    box-shadow:0 1px 4px rgba(12,35,64,.4);
    transition:transform .15s, opacity .2s;
  }
  .wp:hover{transform:translate(-50%,-50%) rotate(45deg) scale(1.3); z-index:9;}
  .wp.selected{outline:3px solid var(--navy); outline-offset:1px;}
  .wp.dim{opacity:.15; pointer-events:none;}
  .wp .n{
    position:absolute; inset:0; transform:rotate(-45deg);
    color:#fff; font-size:9.5px; font-weight:700; text-align:center; line-height:14px;
  }
  .wp.clu{width:27px; height:27px; border-radius:6px;}
  .wp.clu .n{font-size:9px; line-height:23px; letter-spacing:-.3px;}
  .wp.done{opacity:.45;}
  .wp.done .n .num{display:none;}
  .wp .n .tick{display:none;}
  .wp.done .n .tick{display:inline;}

  .rangebar{
    position:absolute; top:calc(var(--ry) - 18px); height:5px; border-radius:3px; opacity:.55; z-index:4;
    transition:opacity .2s; pointer-events:none;
  }
  .rangebar.dim{opacity:.1;}
  .rangebar.done{opacity:.22;}

  .today-tick{
    position:absolute; top:calc(var(--ry) - 18px); width:3px; height:36px; transform:translateX(-50%);
    background:var(--navy); border-radius:2px; box-shadow:0 0 0 1.5px #fff; z-index:8; pointer-events:none;
  }
  .here-flag{
    position:absolute; top:calc(var(--ry) + 20px); transform:translateX(-50%); z-index:11; pointer-events:none;
    background:var(--navy); color:#fff; font-size:11.5px; font-weight:700; letter-spacing:1px;
    padding:3px 10px 2px; border-radius:5px; white-space:nowrap; text-transform:uppercase;
  }
  .here-flag::before{
    content:""; position:absolute; left:50%; bottom:100%; transform:translateX(-50%);
    border:5px solid transparent; border-bottom-color:var(--navy);
  }
  .prow:not(.focused) .here-flag{display:none;}

  /* ===== card rail (revealed when a road is focused) ===== */
  .rail{
    grid-column:1 / -1; grid-row:2;
    display:none; flex-wrap:wrap; gap:8px; align-items:flex-start;
    margin:2px 16px 16px 16px; padding:12px; background:var(--bg);
    border:1px solid var(--line); border-radius:10px;
  }
  .prow.focused .rail{display:flex;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:9px;
    cursor:pointer; transition:box-shadow .15s, flex-basis .2s; overflow:hidden;
  }
  .card:hover{box-shadow:0 2px 8px rgba(12,35,64,.12);}
  .card.dim{opacity:.25; pointer-events:none;}
  .card.flash{box-shadow:0 0 0 3px var(--navy);}
  .card.open{flex-basis:100%;}

  .card-head{display:flex; align-items:center; gap:9px; padding:8px 12px 8px 10px;}
  .card .num{
    width:19px; height:19px; border-radius:5px; transform:rotate(45deg); flex-shrink:0;
    position:relative; margin:0 2px;
  }
  .card .num span{
    position:absolute; inset:0; transform:rotate(-45deg);
    color:#fff; font-size:10.5px; font-weight:700; text-align:center; line-height:19px;
  }
  .card input{accent-color:var(--navy); cursor:pointer; flex-shrink:0;}
  .card .c-date{font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:.4px; white-space:nowrap;}
  .card .c-title{font-size:13px; font-weight:600; color:var(--navy);}
  .card.done .c-title{text-decoration:line-through; color:var(--muted);}
  .card.done{opacity:.7;}

  .card-body{display:none; padding:0 14px 12px 44px;}
  .card.open .card-body{display:block;}
  .card-body .tags{display:flex; gap:6px; margin-bottom:6px;}
  .tag{font-size:10.5px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; padding:2px 9px; border-radius:11px; color:#fff;}
  .tag.cat{background:var(--navy);}
  .card-body .full-date{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:5px;}
  .card-body ul{margin:0 0 0 16px;}
  .card-body li{margin-bottom:3px; font-size:13px;}

  .notes{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 20px;}
  .notes h2{font-size:16px; text-transform:uppercase; letter-spacing:.8px; color:var(--navy); margin-bottom:7px;}
  .notes li{margin:0 0 4px 18px; font-size:13.5px;}

  @media print{
    body{background:#fff; zoom:1;}
    header{position:static;}
    .topbars{position:static; box-shadow:none;}
    .filters{display:none;}
    .stack-wrap{border:none;}
  }

  /* ===== header controls ===== */
  .hdr-right{display:flex; align-items:center; gap:12px;}
  .hdr-btn{
    border:1px solid rgba(255,255,255,.45); background:transparent; color:#fff; border-radius:16px;
    padding:4px 14px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .hdr-btn.on{background:#fff; color:var(--navy);}
  .conn{font-size:11px; color:rgba(255,255,255,.75); display:flex; align-items:center; gap:6px; font-family:'Inter',sans-serif;}
  .conn i{width:8px; height:8px; border-radius:50%; background:#9AA5B1; display:inline-block;}
  .conn.live i{background:#4CAF7A;}
  .conn.local i{background:#C77D1F;}

  /* ===== edit mode ===== */
  .e-btns{display:none; margin-left:auto; gap:5px; flex-shrink:0;}
  body.editing .e-btns{display:flex;}
  .e-btn{
    border:1px solid var(--line); background:#fff; border-radius:6px; font-size:10.5px;
    padding:2px 8px; cursor:pointer; color:var(--navy); font-weight:600; font-family:'Inter',sans-serif;
  }
  .e-btn:hover{background:var(--bg);}
  .e-btn.del{color:var(--red); border-color:#E4C1C4;}
  .add-chip{border-style:dashed !important; font-weight:600; color:var(--navy);}
  body:not(.editing) .add-chip{display:none;}

  /* ===== modal ===== */
  .modal{position:fixed; inset:0; z-index:900; background:rgba(12,35,64,.45); display:flex; align-items:center; justify-content:center;}
  .modal[hidden]{display:none;}
  .modal-box{background:#fff; border-radius:12px; padding:20px 22px; width:400px; max-width:92vw; box-shadow:0 12px 40px rgba(12,35,64,.35);}
  .modal-box h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-size:20px; text-transform:uppercase; letter-spacing:.6px; color:var(--navy); margin-bottom:14px;}
  .mrow{display:grid; grid-template-columns:78px 1fr; gap:10px; align-items:center; margin-bottom:10px;}
  .mrow label{font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  .mrow input, .mrow select, .mrow textarea{
    border:1px solid var(--line); border-radius:7px; padding:7px 9px; font-size:13.5px;
    font-family:'Inter',sans-serif; width:100%;
  }
  .mrow textarea{resize:vertical;}
  .m-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}
  .mprimary{background:var(--navy) !important; color:#fff !important; border-color:var(--navy) !important;}
</style>

<style>
  #gate{position:fixed; inset:0; z-index:1000; background:#0C2340; display:flex; align-items:center; justify-content:center; zoom:1.3334;}
  #gate .gate-box{text-align:center; padding:24px; max-width:340px; width:100%;}
  #gate img.gate-logo{width:130px; height:auto; margin-bottom:18px;}
  #gate h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif; color:#fff; font-size:30px; font-weight:700; letter-spacing:1px; text-transform:uppercase; line-height:1.15;}
  #gate .gate-sub{color:rgba(255,255,255,.65); font-size:13px; margin:6px 0 24px; font-family:'Inter',sans-serif;}
  #gate input{width:100%; padding:11px 14px; border-radius:8px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; font-size:16px; text-align:center; font-family:'Inter',sans-serif; outline:none;}
  #gate input::placeholder{color:rgba(255,255,255,.4);}
  #gate input:focus{border-color:#fff;}
  #gate button{width:100%; margin-top:12px; padding:11px; border-radius:8px; border:none; background:#BD3039; color:#fff; font-size:14px; font-weight:600; letter-spacing:.5px; cursor:pointer; font-family:'Inter',sans-serif; text-transform:uppercase;}
  #gate button:hover{filter:brightness(1.1);}

const d = s => new Date(s + "T12:00:00");
const DAY = 86400000;
const YEAR_START = d("2026-08-24"), YEAR_END = d("2027-12-31"); /* rolling window: 2026 actuals into predicted 2027 */
const yDays = (YEAR_END - YEAR_START)/DAY;
const phaseOf = date => PHASES.find(p => !p.stub ? (date >= d(p.start) && date <= d(p.end)) : (date >= d(p.start) && date <= d(p.end))) || PHASES[0];
const fmt = date => date.toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric"});
const shortDate = date => date.toLocaleDateString("en-US",{month:"short", day:"numeric"}).toUpperCase();
const daysIn = p => (d(p.end)-d(p.start))/DAY + 1;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80);

const TODAY_OVERRIDE = null; /* e.g. "2026-09-15" pins We Are Here for testing or screenshots */
let TODAY = TODAY_OVERRIDE ? d(TODAY_OVERRIDE) : new Date();
TODAY = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate(), 12);
/* The rolling window runs Aug 24 2026 through Dec 31 2027. If the system date is outside it, clamp to the nearest edge. */
if (TODAY < YEAR_START) TODAY = new Date(YEAR_START.getTime());
if (TODAY > YEAR_END)   TODAY = new Date(YEAR_END.getTime());
const TODAY_PHASE = phaseOf(TODAY).name;

/* ===== Rolling visibility rule =====
   Only one instance of each phase type shows at a time: a phase is visible while it has
   not yet ended AND it is the earliest not-yet-ended phase of its type. During In-Season
   2026 everything through Spring Training 2027 shows; In-Season 2027 appears the day
   In-Season 2026 completes, and a phase drops off the day after it completes.
   Set SHOW_ALL_PHASES = true to preview the entire two-year stack (testing only). */
const SHOW_ALL_PHASES = false;
const VIS_PHASES = (() => {
  if (SHOW_ALL_PHASES) return PHASES.slice();
  const firstOpen = {};
  PHASES.forEach(p => { if (TODAY <= d(p.end) && !(p.ptype in firstOpen)) firstOpen[p.ptype] = p.name; });
  return PHASES.filter(p => firstOpen[p.ptype] === p.name);
})();
const VIS_NAMES = new Set(VIS_PHASES.map(p => p.name));
const VIS_START = d(VIS_PHASES[0].start);
const VIS_END = d(VIS_PHASES[VIS_PHASES.length - 1].end);
const visDays = (VIS_END - VIS_START)/DAY;

/* seed items -> unified raw item shape with stable ids */
function seedRaw(){
  return [
    ...SEED_EVENTS.map(e => ({ id: slug(e.date+"-"+e.title), kind:"event", date:e.date, title:e.title, cat:e.cat, detail:e.detail })),
    ...SEED_RANGES.map(r => ({ id: slug(r.start+"-"+r.title), kind:"range", start:r.start, end:r.end, title:r.title, cat:r.cat, detail:r.detail }))
  ];
}

/* ================= backend: Firebase live sync, or standalone ================= */
const conn = document.getElementById("conn"), connTxt = document.getElementById("connTxt");
function setConn(mode, txt){ conn.className = "conn " + mode; connTxt.textContent = txt; }

let backend = null;

function localBackend(){
  const IKEY = "sc_live_items_v2", DKEY = "sc_road_2027_done"; /* IKEY bumped for the rolling-calendar seed; done ids are stable so DKEY keeps existing check-offs */
  let items, done;
  try { items = JSON.parse(localStorage.getItem(IKEY)) || seedRaw(); } catch(e){ items = seedRaw(); }
  try { done = new Set(JSON.parse(localStorage.getItem(DKEY)) || []); } catch(e){ done = new Set(); }
  const saveI = () => { try { localStorage.setItem(IKEY, JSON.stringify(items)); } catch(e){} };
  const saveD = () => { try { localStorage.setItem(DKEY, JSON.stringify([...done])); } catch(e){} };
  let cbI, cbD;
  return {
    init(onItems, onDone){ cbI=onItems; cbD=onDone; setConn("local","standalone (this device only)"); cbI(items); cbD(done); },
    setDone(id, val){ val ? done.add(id) : done.delete(id); saveD(); cbD(done); },
    addItem(o){ items.push(o); saveI(); cbI(items); },
    removeItem(id){ items = items.filter(i=>i.id!==id); saveI(); cbI(items); },
    updateItem(id, fields){ items = items.map(i=>i.id===id ? {...i, ...fields} : i); saveI(); cbI(items); }
  };
}

async function firebaseBackend(cfg){
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getAuth, signInAnonymously } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const F = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app = initializeApp(cfg);
  await signInAnonymously(getAuth(app));
  const db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  const itemsCol = F.collection(db, "boards", BOARD_ID, "items");
  const doneCol  = F.collection(db, "boards", BOARD_ID, "done");

  /* seed once: if the board is empty, write the built-in dataset */
  const first = await F.getDocs(itemsCol);
  if (first.empty){
    const batch = F.writeBatch(db);
    seedRaw().forEach(o => { const {id, ...data} = o; batch.set(F.doc(itemsCol, id), data); });
    await batch.commit();
  }

  return {
    init(onItems, onDone){
      F.onSnapshot(itemsCol, snap => {
        const items = snap.docs.map(dc => ({ id: dc.id, ...dc.data() }));
        onItems(items);
        setConn("live", "live \u00b7 synced");
      }, () => setConn("local","sync error - check Firebase setup"));
      F.onSnapshot(doneCol, snap => {
        onDone(new Set(snap.docs.map(dc => dc.id)));
      });
    },
    setDone(id, val){
      const ref = F.doc(doneCol, id);
      (val ? F.setDoc(ref, { v:true }) : F.deleteDoc(ref)).catch(()=>{});
    },
    addItem(o){ const {id, ...data} = o; F.setDoc(F.doc(itemsCol, id), data).catch(()=>{}); },
    removeItem(id){ F.deleteDoc(F.doc(itemsCol, id)).catch(()=>{}); F.deleteDoc(F.doc(doneCol, id)).catch(()=>{}); },
    updateItem(id, fields){ F.updateDoc(F.doc(itemsCol, id), fields).catch(()=>{}); }
  };
}

function buildItems(raw){
  const out = [];
  raw.forEach(r => {
    try{
      if (r.kind === "range"){
        const x1 = d(r.start), x2 = d(r.end);
        if (x2 < YEAR_START || x1 > YEAR_END) return;
        out.push({ id:r.id, kind:"range", raw:r, sort:x1, x1, x2,
          date: shortDate(x1)+" \u2013 "+shortDate(x2),
          fullDate: fmt(x1)+" through "+fmt(x2),
          title:r.title, cat:r.cat||"Other", detail:r.detail||[], phase:phaseOf(x1) });
      } else {
        const x1 = d(r.date);
        if (x1 < YEAR_START || x1 > YEAR_END) return;
        out.push({ id:r.id, kind:"event", raw:r, sort:x1, x1, x2:x1,
          date: shortDate(x1), fullDate: fmt(x1),
          title:r.title, cat:r.cat||"Other", detail:r.detail||[], phase:phaseOf(x1) });
      }
    } catch(e){ /* skip malformed */ }
  });
  /* rolling visibility: only items in currently visible phases are rendered;
     items in hidden phases stay in the database and reappear when their phase rolls into view */
  const vis = out.filter(it => VIS_NAMES.has(it.phase.name));
  vis.sort((a,b)=>a.sort-b.sort || a.x2-b.x2 || a.title.localeCompare(b.title));
  const counters = {};
  vis.forEach(it => { counters[it.phase.name]=(counters[it.phase.name]||0)+1; it.num=counters[it.phase.name]; });
  return vis;
}

function renderAll(){
  markerRegistry = [];
  stack.innerHTML = "";

  VIS_PHASES.forEach(p=>{
    if (p.stub) return;
    const pDays = daysIn(p) + (p.extraDays||0);
    const roadW = pDays * P;
    const endLbl = p.dispEnd || shortDate(d(p.end));
    const items = ITEMS.filter(it=>it.phase.name===p.name);
    const xOf = date => ((date - d(p.start))/DAY + .5) * P;

    const row = document.createElement("div");
    row.className = "prow";
    row.dataset.phase = p.name;
    row.innerHTML = `
      <button class="phase-sign" data-phase="${p.name}">
        <span class="pname" style="background:${p.hex}">${p.name}</span>
        <span class="pdates">${shortDate(d(p.start))} \u2013 ${endLbl} \u00b7 ${items.length} item${items.length===1?"":"s"}</span>
      </button>
      <div class="road-zone">
        <div class="road" data-phase="${p.name}" style="width:${roadW}px; background:${p.hex}"><div class="lane"></div></div>
        <span class="roadcap" style="left:2px">${shortDate(d(p.start))}</span>
        <span class="roadcap endcap" style="left:${roadW-2}px">${endLbl}</span>
      </div>
      <div class="rail"></div>`;
    stack.appendChild(row);

    const zone = row.querySelector(".road-zone");
    const road = row.querySelector(".road");
    const rail = row.querySelector(".rail");
    const roadEnd = new Date(d(p.end).getTime() + (p.extraDays||0)*DAY);

    let cur = new Date(d(p.start));
    while (cur.getDay()!==1) cur = new Date(cur.getTime()+DAY);
    while (cur <= roadEnd){
      const dot = document.createElement("div");
      dot.className="wk"; dot.style.left = xOf(cur)+"px";
      road.appendChild(dot);
      cur = new Date(cur.getTime()+7*DAY);
    }
    let mcur = new Date(d(p.start).getFullYear(), d(p.start).getMonth()+1, 1);
    while (mcur < d(p.end)){
      const x = xOf(mcur);
      if (x > 42 && x < roadW-42){
        zone.insertAdjacentHTML("beforeend",
          `<div class="mtick" style="left:${x}px"></div>
           <div class="mtick-lbl" style="left:${x}px">${mcur.toLocaleDateString("en-US",{month:"short"}).toUpperCase()}</div>`);
      }
      mcur = new Date(mcur.getFullYear(), mcur.getMonth()+1, 1);
    }

    items.forEach(it=>{
      if (it.kind==="range"){
        const x1 = xOf(it.x1), x2 = xOf(it.x2);
        const bar = document.createElement("div");
        bar.className="rangebar"; bar.dataset.cat=it.cat; bar.dataset.id=it.id;
        bar.style.left=Math.min(x1,x2)+"px"; bar.style.width=Math.max(10,Math.abs(x2-x1))+"px";
        bar.style.background=p.hex;
        zone.appendChild(bar);
      }
      rail.insertAdjacentHTML("beforeend", cardHTML(it));
    });
    if (!items.length){
      rail.innerHTML = `<span style="font-size:12.5px; color:var(--muted); padding:2px 4px;">No items scheduled in this phase yet.</span>`;
    }

    /* clustered markers */
    const pts = items.map(it=>({
      it, x: it.kind==="range" ? (xOf(it.x1)+xOf(it.x2))/2 : xOf(it.x1)
    })).sort((a,b)=>a.x-b.x);
    const CL_SEP = 24;
    const clusters = [];
    pts.forEach(o=>{
      const c = clusters[clusters.length-1];
      if (c && o.x - c.members[c.members.length-1].x < CL_SEP) c.members.push(o);
      else clusters.push({members:[o]});
    });
    clusters.forEach(c=>{
      c.x = c.members.reduce((s,m)=>s+m.x,0)/c.members.length;
      c.ids = c.members.map(m=>m.it.id);
      c.cats = [...new Set(c.members.map(m=>m.it.cat))];
      const nums = c.members.map(m=>m.it.num);
      c.numTxt = nums.length===1 ? String(nums[0]) : `${Math.min(...nums)}\u2013${Math.max(...nums)}`;
      c.titleTxt = nums.length===1
        ? `${c.members[0].it.num}. ${c.members[0].it.title}`
        : `${c.numTxt} \u00b7 ${nums.length} items`;
      c.tip = c.members.map(m=>`${m.it.num}. ${m.it.date} \u00b7 ${m.it.title}`).join("\n");

      const wp = document.createElement("div");
      wp.className = "wp" + (c.members.length>1 ? " clu" : "");
      wp.dataset.ids = c.ids.join(";");
      wp.dataset.cats = c.cats.join(";");
      wp.style.left = c.x + "px";
      wp.style.background = p.hex;
      wp.title = c.tip;
      wp.innerHTML = `<span class="n"><span class="num">${c.numTxt}</span><span class="tick">\u2713</span></span>`;
      road.appendChild(wp);
      c.el = wp;
      markerRegistry.push(c);

      const lbl = document.createElement("div");
      lbl.className="mlbl";
      lbl.dataset.ids = c.ids.join(";");
      lbl.dataset.cats = c.cats.join(";");
      lbl.style.left = c.x+"px";
      lbl.textContent = c.titleTxt;
      lbl.title = c.tip;
      zone.appendChild(lbl);
      c.lblEl = lbl;

      const stem = document.createElement("div");
      stem.className="mstem"; stem.dataset.cats=c.cats.join(";");
      stem.style.left = c.x+"px";
      zone.appendChild(stem);
      c.ldEl = stem;
    });

    if (TODAY_PHASE===p.name){
      const x = xOf(TODAY);
      zone.insertAdjacentHTML("beforeend",
        `<div class="today-tick" style="left:${x}px"></div>
         <div class="here-flag" style="left:${x}px">We are here \u00b7 ${shortDate(TODAY)}</div>`);
    }
  });

  renderChecklist();
  renderCatChips();
  renderDone();
  applyFocusClasses();
  if (qlKind) applyQuickLook(qlKind); else applyDims();
  updateProgress();
}

function renderChecklist(){
  const openPhases = new Set([...ckEl.querySelectorAll(".ck-group:not(.closed)")].map(g=>g.dataset.gphase));
  ckEl.innerHTML = VIS_PHASES.map(p=>{
    if (p.stub) return "";
    const items = ITEMS.filter(it=>it.phase.name===p.name);
    if (!items.length) return "";
    return `
    <div class="ck-group ${openPhases.has(p.name) ? "" : "closed"}" data-gphase="${p.name}">
      <button class="ck-ghead">
        <span class="chev">\u25BC</span>
        <span class="gdot" style="background:${p.hex}"></span>
        ${p.name}
        <span class="gcount">0/${items.length}</span>
      </button>
      <div class="ck-list">
        ${items.map(it=>`
        <label class="ck-item" data-id="${esc(it.id)}" data-cat="${esc(it.cat)}" data-phase="${it.phase.name}">
          <input type="checkbox">
          <span class="ck-txt"><span class="ck-date">${it.num}. ${it.date}</span>${esc(it.title)}</span>
        </label>`).join("")}
      </div>
    </div>`;
  }).join("");
}

function renderCatChips(){
  const chips = document.getElementById("catChips");
  const cats = [...new Set(ITEMS.map(e=>e.cat))].sort();
  if (catFilter!=="all" && !cats.includes(catFilter)) catFilter = "all";
  chips.innerHTML = `<button class="chip ${catFilter==="all"?"active":""}" data-cat="all">All</button>` +
    cats.map(c=>`<button class="chip ${catFilter===c?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  document.getElementById("catList").innerHTML = cats.map(c=>`<option value="${esc(c)}">`).join("");
}

function renderDone(){
  document.querySelectorAll(".card,.ck-item,.rangebar").forEach(el=>{
    const v = doneSet.has(el.dataset.id);
    el.classList.toggle("done", v);
    const cb = el.querySelector?.("input[type=checkbox]");
    if (cb) cb.checked = v;
  });
  markerRegistry.forEach(c=>{
    const allDone = c.ids.every(id=>doneSet.has(id));
    c.el.classList.toggle("done", allDone);
    c.lblEl?.classList.toggle("done", allDone);
  });
}

function updateProgress(){
  const n = ITEMS.length, c = ITEMS.filter(it=>doneSet.has(it.id)).length;
  document.getElementById("progTxt").textContent = `${c} of ${n} complete`;
  document.getElementById("progFill").style.width = (n ? c/n*100 : 0) + "%";
  document.getElementById("vLbl").textContent = `All Items \u00b7 ${c}/${n}`;
  ckEl.querySelectorAll(".ck-group").forEach(g=>{
    const ids = [...g.querySelectorAll(".ck-item")].map(el=>el.dataset.id);
    const done = ids.filter(id=>doneSet.has(id)).length;
    g.querySelector(".gcount").textContent = `${done}/${ids.length}`;
  });
}

/* ================= focus & rotation ================= */
function applyFocusClasses(){
  const rows = [...stack.querySelectorAll(".prow")];
  if (focusPhase && !rows.some(r=>r.dataset.phase===focusPhase)) focusPhase = null;
  const chrono = VIS_PHASES.filter(p=>!p.stub).map(p=>p.name);
  let order = chrono;
  if (focusPhase){
    const i = chrono.indexOf(focusPhase);
    order = [...chrono.slice(i), ...chrono.slice(0,i)];
  }
  order.forEach(name=>{
    const r = rows.find(x=>x.dataset.phase===name);
    if (r) stack.appendChild(r);
  });
  rows.forEach(r=>{
    r.classList.toggle("focused", r.dataset.phase===focusPhase);
    r.classList.toggle("faded", !!focusPhase && r.dataset.phase!==focusPhase);
  });
  document.querySelectorAll(".minimap .seg").forEach(el=>{
    el.classList.toggle("faded", !!focusPhase && el.dataset.phase!==focusPhase);
  });
}
function setFocus(name){
  focusPhase = name;
  applyFocusClasses();
  if (name) document.querySelector(".stack-wrap")?.scrollIntoView({behavior:"smooth", block:"nearest"});
  applyDims();
}
function togglePhase(name){ setFocus(focusPhase===name ? null : name); }
mm.addEventListener("click", e=>{
  const seg = e.target.closest(".seg");
  if (seg) togglePhase(seg.dataset.phase);
});

/* ================= filters & quick look ================= */
function recomputePasses(){
  ITEMS.forEach(it=>{
    const catOk = catFilter==="all" || it.cat===catFilter;
    const qlOk = !qlSet || qlSet.has(it.id);
    idPass[it.id] = catOk && qlOk;
  });
}
function applyDims(){
  recomputePasses();
  document.querySelectorAll(".rangebar,.card").forEach(el=>{
    el.classList.toggle("dim", !idPass[el.dataset.id]);
  });
  document.querySelectorAll(".wp,.mlbl,.mstem").forEach(el=>{
    const ids = (el.dataset.ids || "").split(";").filter(Boolean);
    el.classList.toggle("dim", !ids.some(id=>idPass[id]));
  });
  document.querySelectorAll(".ck-item").forEach(el=>{
    const phOk = !focusPhase || el.dataset.phase===focusPhase;
    el.classList.toggle("dim", !(idPass[el.dataset.id] && phOk));
  });
}

const filtersEl = document.getElementById("filters");
filtersEl.addEventListener("click", e=>{
  if (e.target.closest("#addItemBtn")){ openModal("add"); return; }
  const ql = e.target.closest(".ql-chip");
  if (ql){ toggleQuickLook(ql.dataset.ql); return; }
  const btn = e.target.closest(".chip"); if(!btn || btn.dataset.cat===undefined) return;
  catFilter = btn.dataset.cat;
  document.querySelectorAll("#catChips .chip").forEach(b=>b.classList.toggle("active", b.dataset.cat===catFilter));
  applyDims();
});

const qlPanel = document.getElementById("qlPanel");
const qlCards = document.getElementById("qlCards");
const QL_TITLES = { week:"This Week", month:"This Month", phase:"This Phase" };
function qlWindow(kind){
  if (kind==="week"){
    const dow = (TODAY.getDay()+6)%7;
    const s = new Date(TODAY.getTime() - dow*DAY);
    return [s, new Date(s.getTime()+6*DAY)];
  }
  if (kind==="month"){
    return [new Date(TODAY.getFullYear(), TODAY.getMonth(), 1, 12),
            new Date(TODAY.getFullYear(), TODAY.getMonth()+1, 0, 12)];
  }
  const p = phaseOf(TODAY);
  return [d(p.start), d(p.end)];
}
function applyQuickLook(kind){
  qlKind = kind;
  filtersEl.querySelectorAll(".ql-chip").forEach(b=>b.classList.toggle("active", b.dataset.ql===qlKind));
  document.querySelectorAll(".ql-band").forEach(b=>b.remove());
  if (!qlKind){ qlSet=null; qlPanel.hidden=true; applyDims(); return; }
  const [s, e] = qlWindow(qlKind);
  const inWin = ITEMS.filter(it=> it.x1<=e && it.x2>=s);
  qlSet = new Set(inWin.map(it=>it.id));
  document.getElementById("qlTitle").textContent = QL_TITLES[qlKind];
  document.getElementById("qlRange").textContent = `${shortDate(s)} \u2013 ${shortDate(e)}`;
  document.getElementById("qlCount").textContent = `\u00b7 ${inWin.length} item${inWin.length===1?"":"s"}`;
  qlCards.innerHTML = inWin.length
    ? inWin.map(cardHTML).join("")
    : `<span class="ql-empty">Nothing scheduled in this window. Clear road ahead.</span>`;
  qlCards.querySelectorAll(".card").forEach(c=>{
    const done = doneSet.has(c.dataset.id);
    c.classList.toggle("done", done);
    c.querySelector("input").checked = done;
  });
  qlPanel.hidden = false;
  PHASES.forEach(p=>{
    if (p.stub) return;
    const s2 = d(p.start) > s ? d(p.start) : s;
    const e2 = d(p.end) < e ? d(p.end) : e;
    if (s2 > e2) return;
    const zone = stack.querySelector(`.prow[data-phase="${p.name}"] .road-zone`);
    if (!zone) return;
    const left = ((s2 - d(p.start))/DAY) * P;
    const width = ((e2 - s2)/DAY + 1) * P;
    const band = document.createElement("div");
    band.className = "ql-band";
    band.style.left = (left-3)+"px";
    band.style.width = (width+6)+"px";
    zone.appendChild(band);
  });
  applyDims();
}
function toggleQuickLook(kind){ applyQuickLook(qlKind===kind ? null : kind); }
document.getElementById("qlClose").addEventListener("click", ()=>applyQuickLook(null));

/* ================= shared interactions ================= */
function setDoneUI(id, val){
  if (val) doneSet.add(id); else doneSet.delete(id);
  renderDone(); updateProgress();
}
function handleCardArea(e, root){
  const eb = e.target.closest(".e-btn");
  if (eb){
    e.stopPropagation();
    const it = ITEMS.find(x=>x.id===eb.dataset.eid);
    if (!it) return true;
    if (eb.classList.contains("e-del")){
      if (confirm(`Remove "${it.title}" for everyone?`)) backend.removeItem(it.id);
    } else {
      openModal("date", it);
    }
    return true;
  }
  const head = e.target.closest(".card-head");
  if (head && !e.target.matches("input")){
    head.parentElement.classList.toggle("open");
    return true;
  }
  return false;
}
stack.addEventListener("click", e=>{
  if (handleCardArea(e)) return;
  const sign = e.target.closest(".phase-sign");
  if (sign){ togglePhase(sign.dataset.phase); return; }
  const wp = e.target.closest(".wp,.mlbl");
  if (wp){
    const row = wp.closest(".prow");
    if (!row.classList.contains("focused")) setFocus(row.dataset.phase);
    const ids = (wp.dataset.ids || "").split(";").filter(Boolean);
    document.querySelectorAll(".wp").forEach(w=>w.classList.remove("selected"));
    row.querySelector(`.wp[data-ids="${wp.dataset.ids}"]`)?.classList.add("selected");
    row.querySelectorAll(".card.open").forEach(c=>{ if(!ids.includes(c.dataset.id)) c.classList.remove("open"); });
    let first = null;
    ids.forEach(id=>{
      const card = row.querySelector(`.card[data-id="${id}"]`);
      if (!card) return;
      if (!first) first = card;
      card.classList.add("open");
      card.classList.add("flash");
      setTimeout(()=>card.classList.remove("flash"), 900);
    });
    first?.scrollIntoView({behavior:"smooth", block:"nearest"});
    return;
  }
  const road = e.target.closest(".road");
  if (road){ togglePhase(road.dataset.phase); return; }
});
stack.addEventListener("change", e=>{
  if (e.target.matches(".card input")){
    const id = e.target.closest(".card").dataset.id;
    setDoneUI(id, e.target.checked);
    backend.setDone(id, e.target.checked);
  }
});
qlPanel.addEventListener("click", e=>{ handleCardArea(e); });
qlPanel.addEventListener("change", e=>{
  if (e.target.matches(".card input")){
    const id = e.target.closest(".card").dataset.id;
    setDoneUI(id, e.target.checked);
    backend.setDone(id, e.target.checked);
  }
});

ckEl.addEventListener("click", e=>{
  const gh = e.target.closest(".ck-ghead");
  if (gh) gh.parentElement.classList.toggle("closed");
});
ckEl.addEventListener("change", e=>{
  const item = e.target.closest(".ck-item");
  if (item){
    setDoneUI(item.dataset.id, e.target.checked);
    backend.setDone(item.dataset.id, e.target.checked);
  }
});
document.getElementById("closeAll").addEventListener("click", ()=>{
  ckEl.querySelectorAll(".ck-group").forEach(g=>g.classList.add("closed"));
});

const side = document.getElementById("side");
const layout = document.querySelector(".layout");
const sideToggle = document.getElementById("sideToggle");
function toggleSide(){
  const collapsed = side.classList.toggle("collapsed");
  layout.classList.toggle("side-collapsed", collapsed);
  sideToggle.innerHTML = collapsed ? "&rsaquo;" : "&lsaquo;";
  sideToggle.title = collapsed ? "Show checklist" : "Hide checklist";
}
sideToggle.addEventListener("click", toggleSide);
document.getElementById("vLbl").addEventListener("click", toggleSide);

/* ================= edit mode & modal ================= */
document.getElementById("editToggle").addEventListener("click", function(){
  document.body.classList.toggle("editing");
  this.classList.toggle("on");
  this.textContent = document.body.classList.contains("editing") ? "Done Editing" : "Edit";
});

const modal = document.getElementById("modal");
let modalMode = "add", modalItem = null;
const $ = id => document.getElementById(id);

function showRows(kind){
  const isRange = kind==="range";
  $("mDateRow").style.display = isRange ? "none" : "";
  $("mStartRow").style.display = isRange ? "" : "none";
  $("mEndRow").style.display = isRange ? "" : "none";
}
$("mType").addEventListener("change", e=>showRows(e.target.value));

function openModal(mode, item){
  modalMode = mode; modalItem = item || null;
  const isDateOnly = mode==="date";
  $("mTitle").textContent = isDateOnly ? `Change date \u2013 ${item.title}` : "Add Item";
  $("mTypeRow").style.display = isDateOnly ? "none" : "";
  $("mNameRow").style.display = isDateOnly ? "none" : "";
  $("mCatRow").style.display = isDateOnly ? "none" : "";
  $("mDetailRow").style.display = isDateOnly ? "none" : "";
  const kind = item ? item.kind : $("mType").value;
  if (!isDateOnly) $("mType").value = "event";
  showRows(isDateOnly ? kind : $("mType").value);
  $("mName").value = ""; $("mCat").value = ""; $("mDetail").value = "";
  $("mDate").value = item && item.kind==="event" ? item.raw.date : "";
  $("mStart").value = item && item.kind==="range" ? item.raw.start : "";
  $("mEnd").value = item && item.kind==="range" ? item.raw.end : "";
  modal.hidden = false;
  (isDateOnly ? (kind==="range" ? $("mStart") : $("mDate")) : $("mName")).focus();
}
$("mCancel").addEventListener("click", ()=>{ modal.hidden = true; });
modal.addEventListener("click", e=>{ if (e.target===modal) modal.hidden = true; });

function validDate(v){ return v && d(v) >= YEAR_START && d(v) <= YEAR_END; } /* rolling window: Aug 24 2026 through Dec 31 2027 */

$("mSave").addEventListener("click", ()=>{
  if (modalMode==="date"){
    if (modalItem.kind==="range"){
      const s=$("mStart").value, e=$("mEnd").value;
      if (!validDate(s) || !validDate(e) || e<s){ alert("Enter a valid date range between Aug 24 2026 and Dec 31 2027."); return; }
      backend.updateItem(modalItem.id, { start:s, end:e });
    } else {
      const v=$("mDate").value;
      if (!validDate(v)){ alert("Enter a valid date between Aug 24 2026 and Dec 31 2027."); return; }
      backend.updateItem(modalItem.id, { date:v });
    }
    const movedTo = phaseOf(d($("mDate").value || $("mStart").value));
    if (!VIS_NAMES.has(movedTo.name)){
      alert("Saved. That date falls in " + movedTo.name + ", which is hidden under the rolling view until its phase comes up; the item will reappear then.");
    }
    modal.hidden = true;
    return;
  }
  /* add */
  const kind = $("mType").value;
  const title = $("mName").value.trim();
  const cat = $("mCat").value.trim() || "Other";
  const detail = $("mDetail").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if (!title){ alert("Enter a title."); return; }
  if (!detail.length) detail.push(title + ".");
  let o;
  if (kind==="range"){
    const s=$("mStart").value, e=$("mEnd").value;
    if (!validDate(s) || !validDate(e) || e<s){ alert("Enter a valid date range between Aug 24 2026 and Dec 31 2027."); return; }
    o = { id: slug(s+"-"+title)+"-"+Date.now().toString(36), kind:"range", start:s, end:e, title, cat, detail };
  } else {
    const v=$("mDate").value;
    if (!validDate(v)){ alert("Enter a valid date between Aug 24 2026 and Dec 31 2027."); return; }
    o = { id: slug(v+"-"+title)+"-"+Date.now().toString(36), kind:"event", date:v, title, cat, detail };
  }
  backend.addItem(o);
  const addedPhase = phaseOf(d(o.date || o.start));
  if (!VIS_NAMES.has(addedPhase.name)){
    alert("Saved. That date falls in " + addedPhase.name + ", which is hidden under the rolling view until its phase comes up; the item will appear then.");
  }
  modal.hidden = true;
});

/* ================= header height for sticky bars ================= */
function setHdrH(){
  const h = document.querySelector("header").offsetHeight;
  document.documentElement.style.setProperty("--hdrH", h+"px");
}
setHdrH();
window.addEventListener("resize", setHdrH);

/* ================= boot ================= */
async function boot(){
  if (FIREBASE_CONFIG){
    try {
      setConn("", "connecting\u2026");
      backend = await firebaseBackend(FIREBASE_CONFIG);
    } catch(err){
      console.error("Firebase init failed, falling back to standalone:", err);
      backend = localBackend();
    }
  } else {
    backend = localBackend();
  }
  backend.init(
    raw => { RAW = raw; ITEMS = buildItems(RAW); renderAll(); },
    done => { doneSet = done; renderDone(); updateProgress();
              if (qlKind){ qlCards.querySelectorAll(".card").forEach(c=>{
                const v = doneSet.has(c.dataset.id);
                c.classList.toggle("done", v);
                const cb=c.querySelector("input"); if(cb) cb.checked=v;
              }); } }
  );
}
boot();
</script>

<script>
/* ===== simple shared password gate =====
   To change the password: on the live page open the browser console and run
     sha256('newpassword').then(console.log)
   then replace PASS_HASH below with the output and commit. */
const PASS_HASH = "317b9ef801fd43986fd88b547b65a5e6b180eb61e4bcad3ee9d9f9b2d3032009";
const GATE_KEY = "sc_roadmap_gate";
async function sha256(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
window.sha256 = sha256;
const gate = document.getElementById("gate");
const gatePw = document.getElementById("gatePw");
const gateErr = document.getElementById("gateErr");
function openGate(){ gate.style.display = "none"; }
try { if (localStorage.getItem(GATE_KEY) === PASS_HASH) openGate(); } catch(e){}
async function tryGate(){
  const v = gatePw.value;
  if (!v) return;
  let h = "";
  try { h = await sha256(v); } catch(e){ gateErr.textContent = "This page needs HTTPS to unlock."; return; }
  if (h === PASS_HASH){
    try { localStorage.setItem(GATE_KEY, h); } catch(e){}
    openGate();
  } else {
    gateErr.textContent = "Incorrect password.";
    gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake");
    gatePw.select();
  }
}
document.getElementById("gateGo").addEventListener("click", tryGate);
gatePw.addEventListener("keydown", e=>{ if (e.key==="Enter") tryGate(); });
if ("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
